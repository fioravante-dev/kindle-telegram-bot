# Servidor local da Bot API (arquivos até 2 GB) + bot. Tudo configurado pelo .env (veja .env.example).
services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - botapi:/var/lib/telegram-bot-api

  bot:
    build: .
    restart: unless-stopped
    depends_on: [telegram-bot-api]
    env_file: .env
    environment:
      BOT_API_URL: http://telegram-bot-api:8081
      BOT_API_DIR_SERVER: /var/lib/telegram-bot-api
      BOT_API_DIR_LOCAL: /var/lib/telegram-bot-api
      DATA_DIR: /data
    volumes:
      - botapi:/var/lib/telegram-bot-api
      - ./data:/data

volumes:
  botapi:
